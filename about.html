<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Portfolio - นภัสสร แก้วพรวน</title>
    <link href="https://fonts.googleapis.com/css2?family=Kanit:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>
        * { 
            margin: 0; 
            padding: 0; 
            box-sizing: border-box; 
            font-family: 'Kanit', sans-serif; 
        }
        
        body { 
            background: linear-gradient(135deg, #e0f2fe 0%, #bae6fd 50%, #7dd3fc 100%);
            background-attachment: fixed;
            color: #1e293b; 
            padding: 40px 20px; 
            min-height: 100vh; 
            position: relative;
        }

        .container { 
            max-width: 1050px; 
            margin: 0 auto; 
            position: relative;
            z-index: 1;
        }
        
        /* Header */
        .header { 
            background: rgba(255, 255, 255, 0.92); 
            backdrop-filter: blur(10px);
            padding: 20px 25px; 
            border-radius: 20px; 
            border: 1px solid #bae6fd; 
            box-shadow: 0 10px 25px rgba(14, 165, 233, 0.12); 
            display: flex; 
            justify-content: space-between; 
            align-items: center; 
            margin-bottom: 35px; 
            gap: 15px;
        }
        
        h1 { 
            color: #0284c7; 
            font-size: 1.6rem; 
            font-weight: 700;
            text-align: center;
            flex: 1;
        }
        
        .btn-nav { 
            padding: 10px 22px; 
            border-radius: 50px; 
            text-decoration: none; 
            font-weight: 600; 
            font-size: 0.95rem; 
            transition: all 0.3s ease; 
            white-space: nowrap;
        }
        .btn-back { 
            background: #f0f9ff; 
            color: #0284c7; 
            border: 1.5px solid #0284c7;
        }
        .btn-back:hover { 
            background: #bae6fd; 
            transform: translateY(-2px);
        }
        .btn-next { 
            background: #0284c7; 
            color: #ffffff; 
            box-shadow: 0 4px 12px rgba(2, 132, 199, 0.3); 
        }
        .btn-next:hover { 
            background: #0369a1; 
            transform: translateY(-2px); 
            box-shadow: 0 6px 16px rgba(2, 132, 199, 0.4);
        }
        
        .section-title { 
            color: #0369a1; 
            font-size: 1.45rem; 
            font-weight: 700;
            margin: 20px 0 25px 0; 
            padding-bottom: 8px; 
            border-bottom: 3px solid #38bdf8; 
            display: inline-block; 
        }

        .highlight-box {
            background: rgba(255, 255, 255, 0.85);
            backdrop-filter: blur(8px);
            border: 1px solid #bae6fd;
            border-radius: 20px;
            padding: 30px;
            margin-bottom: 40px;
            box-shadow: 0 8px 20px rgba(14, 165, 233, 0.08);
        }

        .skill-group {
            margin-bottom: 30px;
        }

        .skill-group:last-child {
            margin-bottom: 0;
        }

        .skill-header {
            display: flex;
            align-items: center;
            gap: 10px;
            margin-bottom: 12px;
        }

        .skill-header h3 {
            color: #0284c7;
            font-size: 1.2rem;
            font-weight: 600;
        }

        .skill-desc {
            color: #475569;
            font-size: 0.95rem;
            line-height: 1.6;
            margin-bottom: 15px;
        }

        .grid { 
            display: grid; 
            grid-template-columns: repeat(auto-fit, minmax(280px, 1fr)); 
            gap: 25px; 
            margin-bottom: 35px; 
        }

        .card { 
            background: #ffffff; 
            border-radius: 16px; 
            border: 1px solid #bae6fd; 
            overflow: hidden; 
            box-shadow: 0 4px 15px rgba(14, 165, 233, 0.08); 
            transition: transform 0.3s ease, box-shadow 0.3s ease; 
            cursor: pointer; 
        }
        .card:hover { 
            transform: translateY(-5px); 
            box-shadow: 0 12px 25px rgba(14, 165, 233, 0.22); 
        }
        .card-img { 
            width: 100%; 
            height: 200px; 
            object-fit: cover; 
            background-color: #f0f9ff; 
        }
        .card-body { 
            padding: 18px 20px; 
        }
        .card-body h3 { 
            color: #0284c7; 
            font-size: 1.05rem; 
            font-weight: 600;
            margin-bottom: 8px; 
            line-height: 1.4; 
        }
        .card-body p { 
            color: #475569; 
            font-size: 0.88rem; 
            line-height: 1.6; 
        }
        
        /* Modal Popup */
        .modal { 
            display: none; 
            position: fixed; 
            z-index: 1000; 
            top: 0; 
            left: 0; 
            width: 100%; 
            height: 100%; 
            background: rgba(15, 23, 42, 0.85); 
            backdrop-filter: blur(5px);
            justify-content: center; 
            align-items: center; 
        }
        .modal-content { 
            max-width: 90%; 
            max-height: 90%; 
            border-radius: 12px; 
            box-shadow: 0 10px 30px rgba(0,0,0,0.5);
        }

        @media (max-width: 768px) {
            .header { flex-direction: column; text-align: center; }
            h1 { order: 1; }
            .btn-back { order: 2; width: 100%; text-align: center; }
            .btn-next { order: 3; width: 100%; text-align: center; }
        }
    </style>
</head>
