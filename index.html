<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Portfolio - นภัสสร แก้วพรวน</title>
    <link href="https://fonts.googleapis.com/css2?family=Kanit:wght@300;400;600&display=swap" rel="stylesheet">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Kanit', sans-serif; }
        body { background-color: #F8F9FA; color: #333; min-height: 100vh; display: flex; justify-content: center; align-items: center; padding: 20px; }
        .cover-card { background: white; border-radius: 30px; box-shadow: 0 10px 30px rgba(0,0,0,0.08); max-width: 550px; width: 100%; padding: 40px; border: 3px solid #FFC107; text-align: center; }
        .uni-tag { background: #FFF8E1; color: #D81B60; font-weight: 600; padding: 8px 18px; border-radius: 20px; display: inline-block; margin-bottom: 20px; border: 1px solid #FFE082; font-size: 0.95rem; }
        .profile-frame { width: 180px; height: 180px; margin: 0 auto 20px auto; border-radius: 50%; overflow: hidden; border: 4px solid #FFC107; box-shadow: 0 5px 15px rgba(255,193,7,0.3); }
        .profile-img { width: 100%; height: 100%; object-fit: cover; }
        h1 { color: #37474F; font-size: 2.2rem; margin-bottom: 5px; }
        .nickname { color: #FF8F00; font-size: 1.2rem; font-weight: 600; margin-bottom: 20px; }
        .target-box { background: #ECEFF1; border-left: 5px solid #FFC107; padding: 15px; border-radius: 8px; text-align: left; margin-bottom: 30px; }
        .target-box p { margin-bottom: 5px; color: #455A64; font-size: 0.95rem; }
        .target-box strong { color: #263238; }
        .btn-start { display: inline-block; width: 100%; background: #FFC107; color: #212121; font-weight: 600; font-size: 1.1rem; padding: 14px; border-radius: 50px; text-decoration: none; transition: all 0.3s ease; box-shadow: 0 4px 12px rgba(255,193,7,0.4); }
        .btn-start:hover { background: #FFB300; transform: translateY(-2px); }
    </style>
</head>
<body>
    <div class="cover-card">
        <div class="uni-tag">🎓 Portfolio TCAS1 - มหาวิทยาลัยบูรพา</div>
        <div class="profile-frame">
            <img src="jjface.jpg" alt="นภัสสร แก้วพรวน" class="profile-img">
        </div>
        <h1>นภัสสร แก้วพรวน</h1>
        <div class="nickname">( จีจ้า )</div>
        <div class="target-box">
            <p><strong>คณะ:</strong> สาธารณสุขศาสตร์</p>
            <p><strong>มหาวิทยาลัย:</strong> มหาวิทยาลัยบูรพา</p>
            <p><strong>โรงเรียน:</strong> บ้านบึง "อุตสาหกรรมนุเคราะห์"</p>
        </div>
        <a href="intro.html" class="btn-start">เปิดอ่านแฟ้มสะสมผลงาน →</a>
    </div>
</body>
</html>
